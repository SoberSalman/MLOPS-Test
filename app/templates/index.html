<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Task Manager</h1>
        <form action="/add" method="POST" class="mb-3">
            <div class="input-group">
                <input type="text" name="title" class="form-control" placeholder="Add a new task" required>
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </form>
        <ul class="list-group">
            {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span class="{% if task.completed %}text-decoration-line-through{% endif %}">{{ task.title }}</span>
                <div>
                    <a href="/complete/{{ task.id }}" class="btn btn-sm btn-success">Complete</a>
                    <a href="/delete/{{ task.id }}" class="btn btn-sm btn-danger">Delete</a>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
